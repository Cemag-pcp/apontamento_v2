<div class="modal fade" data-bs-backdrop="static" id="modal-medicao-ezinger" tabindex="-1" aria-labelledby="modal-medicao-ezinger-label" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h5 class="modal-title" id="modal-medicao-ezinger-label">Nova medição</h5>
                    <p class="text-muted mb-0 small">Formulário de Coleta Operacional</p>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <form id="form-medicao-ezinger" novalidate>
                <input type="hidden" name="registro_id" id="medicao_registro_id">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label" for="medicao_tanque">Tanque <span class="text-danger">*</span></label>
                        <select class="form-select" name="tanque" id="medicao_tanque" required>
                            <option value="" selected disabled>Selecione o tanque</option>
                            <option value="desengraxante">Desengraxante</option>
                            <option value="fosfatizante">Fosfatizante</option>
                            <option value="enxague_1">Enxague 1</option>
                            <option value="enxague_2">Enxague 2</option>
                            <option value="enxague_3">Enxague 3</option>
                        </select>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-sm-6">
                            <label class="form-label" for="medicao_data_coleta">Data da Coleta <span class="text-danger">*</span></label>
                            <input class="form-control" type="date" name="data_coleta" id="medicao_data_coleta" required>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label" for="medicao_horario">Horário (HH:MM) <span class="text-danger">*</span></label>
                            <input class="form-control" type="time" name="horario" id="medicao_horario" required>
                        </div>
                    </div>
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <label class="form-label" for="medicao_pressao_bicos">Pressão dos Bicos (bar/kgf) <span class="text-danger">*</span></label>
                            <input class="form-control" type="number" step="0.01" inputmode="decimal" name="pressao_bicos" id="medicao_pressao_bicos" placeholder="Ex: 1.28" required>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label" for="medicao_temperatura">Temperatura (°C) <span class="text-danger">*</span></label>
                            <input class="form-control" type="number" step="0.01" inputmode="decimal" name="temperatura" id="medicao_temperatura" placeholder="Ex: 64.5" required>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-success" id="salvar-medicao-ezinger">
                        <span class="spinner-border spinner-border-sm d-none" id="spinner-medicao-ezinger" aria-hidden="true"></span>
                        <span id="texto-botao-medicao-ezinger">Registrar Medição</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
