{% extends 'base.html' %}
{% load static %}

{% block title %}
<title>Cadastro de Tubos</title>
{% endblock %}

{% block links %}
<link rel="stylesheet" href="{% static 'css/operadores-admin.css' %}">
<link rel="stylesheet" href="{% static 'css/propriedades_ordem.css' %}">
{% endblock %}

{% block content %}
<div id="cadastro-tubos-app" data-api-url="{% url 'cadastro:cadastro_tubos_api' %}">
    <div class="operators-admin-page">
        <section class="operators-shell">
            <header class="operators-topbar">
                <h1 class="operators-title">Cadastro de Tubos</h1>
                <button class="primary-toolbar-button" data-bs-toggle="modal" data-bs-target="#cadastro-tubo-modal">
                    <i class="bi bi-plus-lg"></i>
                    <span>Novo tubo</span>
                </button>
            </header>

            <div class="card card-surface mb-3">
                <div class="card-body">
                    <div class="row g-3 align-items-end">
                        <div class="col-sm-5 col-12">
                            <label class="form-label small text-secondary">Busca</label>
                            <input id="f-search" type="text" class="form-control form-control-sm" placeholder="Codigo ou descricao">
                        </div>
                        <div class="col-sm-3 col-12">
                            <label class="form-label small text-secondary">Status</label>
                            <select id="f-ativo" class="form-select form-select-sm">
                                <option value="true" selected>Ativos</option>
                                <option value="false">Inativos</option>
                                <option value="all">Todos</option>
                            </select>
                        </div>
                        <div class="col-sm-4 col-12 d-flex gap-2">
                            <button id="apply-filters-cadastro" class="btn btn-primary btn-sm flex-fill">
                                <i class="bi bi-funnel me-1"></i>Aplicar filtros
                            </button>
                            <button id="clear-filters-cadastro" class="btn btn-outline-secondary btn-sm">
                                Limpar
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <section class="operators-table-card">
                <div class="table-responsive" style="max-height: 65vh; overflow: auto;">
                    <table class="operators-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Codigo</th>
                            <th>Descricao</th>
                            <th>Status</th>
                            <th class="col-actions">Acoes</th>
                        </tr>
                    </thead>
                    <tbody id="tubos-cadastro-body">
                        <tr id="loading-row-cadastro">
                            <td colspan="5">
                                <div id="overlayLoading" class="operators-loading">
                                    <div class="spinner-border text-primary" role="status"></div>
                                    <span>Carregando tubos...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                    </table>
                </div>

                <footer class="operators-table-footer">
                    <div class="footer-left">
                        <label for="page-size-cadastro" class="footer-label">Rows per page</label>
                        <select id="page-size-cadastro" class="footer-select">
                            <option value="10" selected>10</option>
                            <option value="25">25</option>
                            <option value="50">50</option>
                        </select>
                        <span id="pagination-summary-cadastro" class="footer-summary">0-0 of 0</span>
                    </div>
                    <nav class="operators-pagination" id="cadastro-pagination"></nav>
                </footer>
            </section>
        </section>
    </div>
</div>

<div class="modal fade" id="cadastro-tubo-modal" tabindex="-1" aria-labelledby="cadastro-tubo-modal-label" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="cadastro-tubo-modal-label">Novo tubo</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label small text-secondary">Codigo</label>
                        <input id="c-codigo" type="text" class="form-control form-control-sm" placeholder="Obrigatorio">
                    </div>
                    <div class="col-12">
                        <label class="form-label small text-secondary">Descricao</label>
                        <input id="c-descricao" type="text" class="form-control form-control-sm">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="clear-form-btn" class="btn btn-outline-secondary btn-sm" type="button">Limpar</button>
                <button id="create-tubo-btn" class="btn btn-primary btn-sm" type="button">
                    <i class="bi bi-plus-lg me-1"></i>Criar tubo
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/cadastro_tubos.js' %}" defer></script>
{% endblock %}
