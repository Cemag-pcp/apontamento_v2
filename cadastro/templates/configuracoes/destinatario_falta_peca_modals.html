<!-- Modal: lista de destinatarios -->
<div class="modal fade" id="modalDestinatariosFaltaPeca" tabindex="-1" aria-labelledby="modalDestinatariosFaltaPecaLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="modalDestinatariosFaltaPecaLabel">Destinatários - Falta de peça</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="d-flex justify-content-end mb-3">
          <button type="button" class="btn btn-primary btn-sm" id="btnAbrirAddDestinatarioFaltaPeca">
            <i class="bi bi-plus-lg"></i> Adicionar destinatário
          </button>
        </div>

        <div class="table-responsive">
          <table class="table table-sm align-middle mb-0">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Telefone</th>
                <th>Status</th>
                <th class="text-end">Ações</th>
              </tr>
            </thead>
            <tbody id="tabelaDestinatariosFaltaPeca">
              <tr>
                <td colspan="4" class="text-center text-muted py-4">Carregando...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: adicionar/editar destinatario -->
<div class="modal fade" id="modalFormDestinatarioFaltaPeca" tabindex="-1" aria-labelledby="modalFormDestinatarioFaltaPecaLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="formDestinatarioFaltaPeca">
        {% csrf_token %}
        <input type="hidden" name="destinatario_id" id="destinatarioFaltaPecaId" value="">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="modalFormDestinatarioFaltaPecaLabel">Adicionar destinatário</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="destinatarioFaltaPecaNome">Nome</label>
            <input class="form-control" type="text" name="nome" id="destinatarioFaltaPecaNome" placeholder="Ex.: PCP Montagem" required>
          </div>

          <div class="mb-3">
            <label class="form-label" for="destinatarioFaltaPecaTelefone">Telefone</label>
            <input class="form-control" type="text" name="telefone" id="destinatarioFaltaPecaTelefone" placeholder="5585999012483" pattern="[0-9]{10,15}" required>
            <div class="form-text">DDI + DDD + número, só números, sem espaço, sem "+" (ex: 5585999012483).</div>
          </div>

          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" name="ativo" id="destinatarioFaltaPecaAtivo" checked>
            <label class="form-check-label" for="destinatarioFaltaPecaAtivo">Ativo</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
          <button type="submit" class="btn btn-primary">
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true" style="display: none;"></span>Salvar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
